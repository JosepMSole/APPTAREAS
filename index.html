const KEY='apptareas_v01_store'; const LANG_KEY='apptareas_v02_lang'; let lang=localStorage.getItem(LANG_KEY)||'cast'; if(!['cat','cast','eng'].includes(lang))lang='cast'; const locale=()=>({cat:'ca-ES',cast:'es-ES',eng:'en-GB'}[lang]);const pad=n=>String(n).padStart(2,'0');const localISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const plusDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return localISO(d)};const plusMonths=(s,n)=>{const d=parseISO(s);d.setDate(1);d.setMonth(d.getMonth()+n);return localISO(d)};const weekStart=s=>{const d=parseISO(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return localISO(d)};const monthStart=s=>s.slice(0,7)+'-01';const formatDate=s=>parseISO(s).toLocaleDateString(locale(),{day:'2-digit',month:'2-digit',year:'numeric'});const shortMonth=s=>parseISO(s).toLocaleDateString(locale(),{month:'long',year:'numeric'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);const today=localISO(new Date());const base={users:[{id:'u1',name:'Usuario 1',color:'#7397b8',avatar:''}],tasks:[{id:'t1',name:'Cocinar',icon:'🍳',image:''},{id:'t2',name:'Basura',icon:'🗑️',image:''},{id:'t3',name:'Lavadora',icon:'🧺',image:''},{id:'t4',name:'Limpiar',icon:'🧹',image:''},{id:'t5',name:'Compra',icon:'🛒',image:''},{id:'t6',name:'Platos',icon:'🍽️',image:''}],assignments:[{id:'demo1',date:plusDays(weekStart(today),0),taskId:'t2',userId:'u1',completedAt:null},{id:'demo2',date:plusDays(weekStart(today),0),taskId:'t1',userId:'u2',completedAt:null},{id:'demo3',date:plusDays(weekStart(today),1),taskId:'t3',userId:'u2',completedAt:null},{id:'demo4',date:plusDays(weekStart(today),2),taskId:'t5',userId:'u1',completedAt:null},{id:'demo5',date:plusDays(weekStart(today),2),taskId:'t6',userId:'u2',completedAt:null},{id:'demo6',date:plusDays(weekStart(today),3),taskId:'t4',userId:'u2',completedAt:null},{id:'demo7',date:plusDays(weekStart(today),4),taskId:'t1',userId:'u1',completedAt:null},{id:'demo8',date:plusDays(weekStart(today),5),taskId:'t3',userId:'u1',completedAt:null}],templates:{}};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(base)}catch{data=JSON.parse(JSON.stringify(base))}if(!data.users||!data.tasks||!data.assignments)data=JSON.parse(JSON.stringify(base));data.templates||={};let tab='calendar',view='week',anchor=today,selected=today,profile='u1',historyOpen=false,modal=null,toastHandle;const save=()=>{if(cloud.homeId){queueCloudSave();return true}try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert(tr('No se pudo guardar. El almacenamiento local puede estar lleno. Reduce el tamaño de imágenes.'));return false}};const user=id=>data.users.find(x=>x.id===id),task=id=>data.tasks.find(x=>x.id===id),entries=s=>data.assignments.filter(a=>a.date===s),completed=a=>!!a.completedAt;const PRESET_NAMES={t1:{cat:'Cuinar',cast:'Cocinar',eng:'Cooking'},t2:{cat:'Escombraries',cast:'Basura',eng:'Trash'},t3:{cat:'Rentadora',cast:'Lavadora',eng:'Laundry'},t4:{cat:'Netejar',cast:'Limpiar',eng:'Cleaning'},t5:{cat:'Compra',cast:'Compra',eng:'Groceries'},t6:{cat:'Plats',cast:'Platos',eng:'Dishes'}};const taskName=t=>t?(t.names?.[lang]||((!t.names||!Object.values(t.names).some(Boolean))&&PRESET_NAMES[t.id]&&t.name===PRESET_NAMES[t.id].cast?PRESET_NAMES[t.id][lang]:null)||t.name):tr('Tarea');const imageHTML=(obj,cls='emoji')=>obj?.image?`<img alt="" src="${esc(cloudImageUrl(obj.image))}">`:`<span class="${cls}">${esc(obj?.icon||'📋')}</span>`;const avatarHTML=u=>u.avatar?`<img class="avatar" src="${esc(cloudImageUrl(u.avatar))}" alt="">`:`<div class="avatar" style="background:${u.color}">👤</div>`;const mix=(hex,opacity)=>{let h=hex.replace('#','');if(h.length!==6)return '#e7e7e1';return '#'+[0,2,4].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*opacity+255*(1-opacity)).toString(16).padStart(2,'0')).join('')};const taskBtn=a=>{if(cloud.homeId&&!cloud.memberProfiles.includes(a.userId))return '';let t=task(a.taskId),u=user(a.userId);if(!t||!u)return '';return `<button class="task-icon ${a.completedAt?'done':''}" style="background:${mix(u.color,.22)}" data-action="quick-toggle" data-id="${a.id}" title="${esc(taskName(t))} · ${esc(u.name)}">${imageHTML(t)}</button>`};const activeEntries=s=>entries(s).filter(a=>visibleUsers().some(u=>u.id===a.userId));const dateRows=s=>`<div class="day ${s===today?'today':''}"><div class="day-label"><span class="day-name">${({cat:['DG','DL','DT','DC','DJ','DV','DS'],cast:['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'],eng:['SUN','MON','TUE','WED','THU','FRI','SAT']}[lang])[parseISO(s).getDay()]}</span><span class="day-number">${parseISO(s).getDate()}</span></div><span class="vline"></span><div class="day-tasks">${activeEntries(s).length?activeEntries(s).map(taskBtn).join(''):'<span class="empty">Sin tareas</span>'}</div><button class="add-day" data-action="assign" data-date="${s}" title="Añadir tarea">+</button></div>`;
function calendar(){const start=view==='week'?weekStart(anchor):monthStart(anchor);let body;if(view==='week'){body=`<div class="days">${Array.from({length:7},(_,i)=>dateRows(plusDays(start,i))).join('')}</div>`}else{const first=parseISO(start),firstOffset=(first.getDay()+6)%7,daysIn=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),cells=Math.ceil((firstOffset+daysIn)/7)*7;body=`<div class="month-grid">${({cat:['DL','DT','DC','DJ','DV','DS','DG'],cast:['L','M','X','J','V','S','D'],eng:['M','T','W','T','F','S','S']}[lang]).map(d=>`<div class="weekday">${d}</div>`).join('')}${Array.from({length:cells},(_,i)=>{const s=plusDays(start,i-firstOffset),valid=s.slice(0,7)===start.slice(0,7);return `<button data-action="select-day" data-date="${s}" class="month-day ${!valid?'out':''} ${s===today?'today':''}" style="${s===selected?'outline:2px solid #91a594;':''}"><span>${parseISO(s).getDate()}</span><span class="mini-dots">${activeEntries(s).slice(0,8).map(a=>`<span class="mini-dot" style="background:${user(a.userId)?.color||'#aaa'};opacity:${a.completedAt?.5:1};filter:${a.completedAt?'grayscale(1)':'none'}"></span>`).join('')}</span></button>`}).join('')}</div><div class="month-detail"><div class="month-detail-head"><strong>${formatDate(selected)}</strong><button class="pill" data-action="assign" data-date="${selected}">＋ Tarea</button></div><div class="day-tasks">${activeEntries(selected).length?activeEntries(selected).map(taskBtn).join(''):'<span class="empty">Sin tareas</span>'}</div></div>`}
const title=view==='week'?`${formatDate(start).slice(0,5)} – ${formatDate(plusDays(start,6))}`:shortMonth(start);return `<div class="surface"><div class="section-head"><h1>Calendario</h1><span style="font-size:20px">📅</span></div><div class="segmented"><button data-action="view" data-view="week" class="${view==='week'?'active':''}">Semana</button><button data-action="view" data-view="month" class="${view==='month'?'active':''}">Mes</button></div><div class="period"><button class="arrow" data-action="prev">‹</button><strong>${title}</strong><button class="arrow" data-action="next">›</button></div><div class="legend">${visibleUsers().map(u=>`<span class="legend-item"><i class="dot" style="background:${u.color}"></i>${esc(u.name)}</span>`).join('')}</div>${body}<button class="copy-box" data-action="copy"><b>⧉ &nbsp; COPIAR CONFIGURACIÓN &nbsp; ›</b><span>Semana o mes · Todos o un usuario</span></button><p class="note calendar-tip">${tr("Toca un icono para completar · Mantén pulsado para editar")}</p></div>`}
function tasksPage(){return `<div class="surface"><div class="section-head"><h1>Tareas</h1><button class="pill primary" data-action="task-new">＋ Nueva</button></div><div class="task-grid">${data.tasks.map(t=>`<button class="task-tile" data-action="task-edit" data-id="${t.id}"><span class="big">${imageHTML(t)}</span><span>${esc(taskName(t))}</span></button>`).join('')}</div><p class="subtle">Toca una tarea para editar su nombre o icono.</p></div>`}
function userPage(){const u=ownUser(),mine=data.assignments.filter(a=>a.userId===profile),done=mine.filter(completed).sort((a,b)=>b.completedAt.localeCompare(a.completedAt)),pending=mine.filter(a=>!a.completedAt);return `<div class="surface"><div class="section-head"><h1>USER</h1><span style="font-size:20px">👤</span></div><div class="user-hero"><div class="user-portrait">${avatarHTML(u)}</div><div class="user-meta"><h2>${esc(u.name)}</h2><div class="user-color-control"><div class="subtle">Color personal</div><input aria-label="Color personal" data-change="color" type="color" value="${u.color}"></div></div></div><div class="stats"><div class="stat pending-stat"><strong>${pending.length}</strong><span>Pendientes</span></div><div class="stat completed-stat"><strong>${done.length}</strong><span>Completadas</span></div></div><button class="fold" data-action="history">🕘 &nbsp; HISTORIAL <span>${historyOpen?'⌃':'⌄'}</span></button>${historyOpen?`<div class="history">${done.length?done.map(a=>`<div class="history-row"><span>${esc(task(a.taskId)?.icon||'✅')}</span><span>${esc(task(a.taskId)?taskName(task(a.taskId)):'Tarea eliminada')}</span><time>Prev. ${formatDate(a.date)}<br>Hecha ${new Date(a.completedAt).toLocaleDateString(locale())}</time><button class="pill" data-action="quick-toggle" data-id="${a.id}" title="Detalles">⋯</button></div>`).join(''):'<p class="subtle">Todavía no hay tareas completadas.</p>'}</div>`:''}<div class="profile-actions"><button class="pill outline" data-action="avatar">▧ Avatar</button><button class="pill outline" data-action="profile-edit">⚙ Nombre</button></div><details class="user-fold"><summary>⌂ &nbsp; ${tr('MI HOGAR')} <span class="fold-chevron" aria-hidden="true">⌄</span></summary>${cloudSettingsPanel()}</details><details class="user-fold install-fold"><summary>📲 &nbsp; ${tr('INSTALAR APPTAREAS')} <span class="fold-chevron" aria-hidden="true">⌄</span></summary>${installPanel()}</details><div class="language-setting"><span class="lang-heading">🌐 &nbsp; IDIOMA / LANGUAGE</span><div class="lang-buttons">${[["cat","CAT"],["cast","CAST"],["eng","ENG"]].map(([code,label])=>`<button type="button" class="lang-btn ${lang===code?"selected":""}" data-action="language" data-lang="${code}" aria-pressed="${lang===code}">${label}</button>`).join("")}</div></div></div>`}
function render(){if(!cloud.configured||!cloud.homeId){renderCloudGate();return}document.getElementById('app').innerHTML=`<header class="header"><div><div class="eyebrow">NUESTRO HOGAR</div><div class="brand">APPTAREAS</div></div><div class="house">⌂</div></header>${tab==='calendar'?calendar():tab==='tasks'?tasksPage():userPage()}<nav class="bottom"><div class="tabs">${[['tasks','☑','TAREAS'],['calendar','▦','CALENDARIO'],['user','♙','USER']].map(([key,ico,label])=>`<button class="navbtn ${tab===key?'active':''}" data-action="tab" data-tab="${key}"><span class="navicon">${ico}</span>${label}</button>`).join('')}</div></nav>`;translateUI(document.getElementById('app'));drawModal()}
const field=(label,control)=>`<div class="field"><label>${label}</label>${control}</div>`;const inp=(id,value='',type='text',extra='')=>`<input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`;const sel=(id,options,selected)=>`<select id="${id}">${options.map(([value,name])=>`<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(name)}</option>`).join('')}</select>`;const formActions=inner=>`<div class="actions">${inner}</div>`;function drawModal(){const overlay=document.getElementById('overlay');if(!modal){overlay.innerHTML='';return}const m=modal;let title='',content='';if(m.kind==='task'){const t=m.id?task(m.id):null;title=t?'Editar tarea':'Nueva tarea';content=`<div class="form-grid">${field('Nombre',inp('task-name',t?.name||'','text','maxlength="48" placeholder="Ej. Aspiradora"'))}${field('Català',inp('task-cat',t?.names?.cat||'','text','maxlength="48" placeholder="Nom en català (opcional)"'))}${field('English',inp('task-eng',t?.names?.eng||'','text','maxlength="48" placeholder="Task name (optional)"'))}${field('Icono (emoji)',inp('task-icon',t?.icon||'🧹','text','maxlength="8"'))}${field('O sube una imagen personalizada',`<input type="file" id="task-file" accept="image/*"><span class="note">La imagen se guarda localmente. Recomendado: imagen pequeña cuadrada.</span>`)}${t?.image?`<div>Icono actual: <img src="${esc(cloudImageUrl(t.image))}" alt="" width="55" height="55" style="object-fit:contain"><label><input type="checkbox" id="task-image-clear"> Quitar imagen</label></div>`:''}</div>${formActions(`<button class="pill primary" data-action="task-save">Guardar</button>${t?'<button class="pill danger" data-action="task-delete">Eliminar</button>':''}<button class="pill outline" data-action="modal-close">Cancelar</button>`)}`}
if(m.kind==='assign'){title='Asignar tarea';content=`<div class="form-grid">${field('Día',inp('assign-date',m.date,'date'))}${field('Tarea',sel('assign-task',data.tasks.map(t=>[t.id,`${t.icon||'🖼'} ${taskName(t)}`]),m.taskId||data.tasks[0]?.id))}${field('Responsable',sel('assign-user',visibleUsers().map(u=>[u.id,u.name]),m.userId||profile))}</div>${formActions(`<button class="pill primary" data-action="assign-save" ${data.tasks.length?'':'disabled'}>Asignar</button><button class="pill outline" data-action="modal-close">Cancelar</button>`)}`}
if(m.kind==='entry'){let a=data.assignments.find(a=>a.id===m.id);if(!a){modal=null;drawModal();return}let t=task(a.taskId),u=user(a.userId);title='Tarea asignada';content=`<div class="user-hero"><div style="font-size:42px">${t?.image?`<img src="${esc(cloudImageUrl(t.image))}" width="55" alt="">`:esc(t?.icon||'📋')}</div><h2>${esc(taskName(t))}</h2><span class="subtle">${esc(u?.name||'')} · ${formatDate(a.date)}</span></div><div class="form-grid" style="margin-top:12px">${field('Día',inp('entry-date',a.date,'date'))}${field('Responsable',sel('entry-user',visibleUsers().map(u=>[u.id,u.name]),a.userId))}</div>${formActions(`<button class="pill primary" data-action="entry-toggle">${a.completedAt?'↶ Pendiente':'✓ Completada'}</button><button class="pill outline" data-action="entry-update">Guardar cambios</button><button class="pill danger" data-action="entry-delete">Eliminar</button>`)}`}
if(m.kind==='copy'){title='Copiar configuración';let unit=m.unit||view;content=`<div class="form-grid">${field('Copiar',sel('copy-unit',[['week','Semana completa'],['month','Mes completo']],unit))}${field('Responsables',sel('copy-user',[['all','Todos los usuarios'],...visibleUsers().map(u=>[u.id,u.name])],'all'))}${field('Período de origen',inp('copy-origin',unit==='week'?weekStart(anchor):monthStart(anchor),'date'))}${field('Período de destino',inp('copy-target',unit==='week'?plusDays(weekStart(anchor),7):plusMonths(monthStart(anchor),1),'date'))}<p class="note">Se mantiene el día de la semana al copiar semanas y el número de día al copiar meses. Si el mes de destino no tiene ese día, se omite. No se duplican asignaciones idénticas. Las copias quedan pendientes.</p></div>${formActions('<button class="pill primary" data-action="copy-run">Copiar</button><button class="pill outline" data-action="modal-close">Cancelar</button>')}`}
if(m.kind==='avatar'){title='Cambiar avatar';content=`<p class="subtle">Sube una imagen para ${esc(user(profile).name)}.</p>${field('Imagen de avatar','<input type="file" id="avatar-file" accept="image/*">')}${formActions('<button class="pill primary" data-action="avatar-save">Guardar avatar</button><button class="pill outline" data-action="modal-close">Cancelar</button>')}`}

if(m.kind==='install'){title='Instalar APPTAREAS';content=installHelp()+formActions('<button class="pill primary" data-action="modal-close">Entendido</button>')}
if(m.kind==='profile'){title='Editar usuario';content=`${field('Nombre',inp('profile-name',user(profile).name,'text','maxlength="35"'))}${formActions('<button class="pill primary" data-action="profile-save">Guardar</button><button class="pill outline" data-action="modal-close">Cancelar</button>')}`}
overlay.innerHTML=`<div class="modal-shell" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" data-action="modal-close">×</button></div>${content}</section></div>`;translateUI(overlay)}
const open=m=>{modal=m;drawModal()};const close=()=>{modal=null;drawModal()};function toast(t){const el=document.getElementById('toast');const reward=t==='¡Tarea completada!'||t==='Tarea pendiente';clearTimeout(toastHandle);el.className='toast'+(reward?' reward-toast'+(t==='Tarea pendiente'?' pending-reward':''):'');if(reward){const done=t==='¡Tarea completada!';const symbol=done?'✓':'↶';el.innerHTML=`<span class="reward-spark s1">✦</span><span class="reward-spark s2">✧</span><span class="reward-spark s3">✧</span><span class="reward-spark s4">✦</span><span class="reward-symbol">${symbol}</span><span class="reward-label">${esc(tr(t))}</span>`;}else el.textContent=tr(t);void el.offsetWidth;el.classList.remove('hidden');toastHandle=setTimeout(()=>{el.classList.add('hidden');el.className='toast hidden'},reward?1000:2700)};const val=id=>document.getElementById(id)?.value;const fileData=async input=>{const file=document.getElementById(input)?.files?.[0];if(!file)return null;if(file.size>7*1024*1024)throw Error('Imagen demasiado grande (máx. 7 MB)');const bitmap=await createImageBitmap(file);let size=256,scale=Math.min(1,size/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close?.();return c.toDataURL('image/webp',.82)};
async function action(a,btn){try{if(a.startsWith('cloud-')){await cloudAction(a,btn);return}if(a==='install-app'){if(deferredInstallPrompt){const prompt=deferredInstallPrompt;deferredInstallPrompt=null;await prompt.prompt();await prompt.userChoice;render()}else open({kind:'install'});}else if(a==='language'){lang=btn.dataset.lang;localStorage.setItem(LANG_KEY,lang);render();toast(({cat:'Idioma canviat',cast:'Idioma cambiado',eng:'Language changed'})[lang]);}else if(a==='tab'){tab=btn.dataset.tab;close();render()}else if(a==='view'){view=btn.dataset.view;anchor=view==='week'?weekStart(anchor):monthStart(anchor);selected=anchor;render()}else if(a==='prev'||a==='next'){anchor=view==='week'?plusDays(anchor,a==='prev'?-7:7):plusMonths(anchor,a==='prev'?-1:1);selected=anchor;render()}else if(a==='select-day'){selected=btn.dataset.date;render()}else if(a==='task-new')open({kind:'task'});else if(a==='task-edit')open({kind:'task',id:btn.dataset.id});else if(a==='task-save'){const name=val('task-name')?.trim(),icon=val('task-icon')?.trim()||'📋',names={cat:val('task-cat')?.trim()||'',eng:val('task-eng')?.trim()||''};if(!name)return alert(tr('Introduce el nombre de la tarea'));const existing=modal.id?task(modal.id):null;let img=await fileData('task-file');if(img&&cloud.homeId)img=await uploadCloudImage(img,'images');if(existing){existing.name=name;existing.names=names;existing.icon=icon;if(img)existing.image=img;else if(document.getElementById('task-image-clear')?.checked)existing.image=''}else data.tasks.push({id:uid(),name,names,icon,image:img||''});if(save()){close();render();toast('Tarea guardada')}}else if(a==='task-delete'){if(confirm(tr('¿Eliminar esta tarea y todas sus asignaciones (incluidas las completadas)?'))){data.tasks=data.tasks.filter(t=>t.id!==modal.id);data.assignments=data.assignments.filter(x=>x.taskId!==modal.id);save();close();render()}}else if(a==='assign')open({kind:'assign',date:btn.dataset.date,taskId:data.tasks[0]?.id});else if(a==='assign-save'){const date=val('assign-date'),taskId=val('assign-task'),userId=val('assign-user');if(!date||!taskId||!visibleUsers().some(u=>u.id===userId))return;data.assignments.push({id:uid(),date,taskId,userId,completedAt:null});if(save()){close();render();toast('Tarea asignada')}}else if(a==='quick-toggle'){const e=data.assignments.find(x=>x.id===btn.dataset.id);if(!e)return;e.completedAt=e.completedAt?null:new Date().toISOString();if(save()){render();toast(e.completedAt?'¡Tarea completada!':'Tarea pendiente')}}else if(a==='entry')open({kind:'entry',id:btn.dataset.id});else if(a==='entry-toggle'){const e=data.assignments.find(x=>x.id===modal.id);e.completedAt=e.completedAt?null:new Date().toISOString();save();close();render();toast(e.completedAt?'¡Tarea completada!':'Tarea pendiente')}else if(a==='entry-update'){const e=data.assignments.find(x=>x.id===modal.id);e.date=val('entry-date');if(!visibleUsers().some(u=>u.id===val('entry-user')))return;e.userId=val('entry-user');save();close();render();toast('Cambios guardados')}else if(a==='entry-delete'){if(confirm(tr('¿Eliminar esta asignación?'))){data.assignments=data.assignments.filter(x=>x.id!==modal.id);save();close();render()}}else if(a==='copy')open({kind:'copy',unit:view});else if(a==='copy-run'){let unit=val('copy-unit'),who=val('copy-user'),from=val('copy-origin'),to=val('copy-target');if(!from||!to)return;const src=unit==='week'?weekStart(from):monthStart(from),dest=unit==='week'?weekStart(to):monthStart(to);const monthDays=unit==='month'?new Date(parseISO(src).getFullYear(),parseISO(src).getMonth()+1,0).getDate():7;let added=0,skipped=0;const source=data.assignments.filter(x=>(!cloud.homeId||cloud.memberProfiles.includes(x.userId))&&x.date>=src&&x.date<(unit==='week'?plusDays(src,7):plusMonths(src,1))&&(who==='all'||who===x.userId));for(const a of source){let date;if(unit==='week'){date=plusDays(dest,Math.round((parseISO(a.date)-parseISO(src))/86400000))}else{let day=parseISO(a.date).getDate(),max=new Date(parseISO(dest).getFullYear(),parseISO(dest).getMonth()+1,0).getDate();if(day>max){skipped++;continue}const d=parseISO(dest);d.setDate(day);date=localISO(d)}if(data.assignments.some(b=>b.date===date&&b.taskId===a.taskId&&b.userId===a.userId)){skipped++;continue}data.assignments.push({id:uid(),date,taskId:a.taskId,userId:a.userId,completedAt:null});added++}save();close();render();toast(`${added} copiadas · ${skipped} omitidas`)}else if(a==='history'){historyOpen=!historyOpen;render()}else if(a==='avatar')open({kind:'avatar'});else if(a==='avatar-save'){let img=await fileData('avatar-file');if(!img)return alert(tr('Selecciona una imagen'));if(cloud.homeId)img=await uploadCloudImage(img,'avatars');user(profile).avatar=img;save();close();render();toast('Avatar cambiado')}else if(a==='profile-edit')open({kind:'profile'});else if(a==='profile-save'){let name=val('profile-name')?.trim();if(!name)return;user(profile).name=name;save();close();render()}else if(a==='modal-close')close();else if(a==='backdrop'&&btn.classList.contains('modal-shell'))close()}catch(err){console.error(err);alert(tr(err.message||'Se ha producido un error'))}}

else if(!logged)html+=`<p class="subtle">${tr('Entra con Google para crear tu hogar o unirte al de tu pareja.')}</p><div class="actions"><button class="pill primary" data-action="cloud-google">G &nbsp; ${tr('Entrar con Google')}</button></div>`;
else html+=`<p class="subtle">${esc(cloud.authUser.email||'')} · ${tr('Crea un hogar o introduce el código que te han enviado.')}</p><div class="field"><label>${tr('Nombre de tu hogar')}</label><input id="cloud-home-name" maxlength="48" value="Nuestro hogar"></div><div class="actions"><button class="pill primary" data-action="cloud-create">⌂ ${tr('Crear hogar')}</button></div><div class="field"><label>${tr('Código de invitación')}</label><input id="cloud-invite" maxlength="16" autocomplete="off" placeholder="XXXXXXXXXXXX"></div><div class="actions"><button class="pill primary" data-action="cloud-join">↗ ${tr('Unirme al hogar')}</button><button class="pill signout-red" data-action="cloud-signout">${tr('Cerrar sesión')}</button></div>`;
html+=`<div class="welcome-install">${installPanel()}</div></div><p class="cloud-foot">${tr('Cada hogar tiene sus propios datos privados. No se importan las pruebas locales.')}</p>`;document.getElementById('app').innerHTML=html;translateUI(document.getElementById('app'));document.getElementById('overlay').innerHTML=''}

async function setupCloud(url,key){if(!window.supabase?.createClient)throw Error('No se pudo cargar la librería de Supabase. Comprueba la conexión a Internet.');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url))throw Error('URL de Supabase no válida');if(!/^(sb_publishable_|eyJ)/.test(key))throw Error('Introduce una clave publishable o anon pública (nunca service_role)');if(key.startsWith('sb_secret_'))throw Error('Nunca uses una clave secreta');
cloud.client=window.supabase.createClient(url.replace(/\/$/,''),key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});cloud.configured=true;cloud.client.auth.onAuthStateChange((event,session)=>{cloud.authUser=session?.user||null;if(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='SIGNED_OUT'){setTimeout(()=>bootstrapCloud(),0)}});}
async function startCloud(){let cfg=cloudConfig();if(!cfg){cloud.error='';render();return}try{cloud.loading=true;await setupCloud(cfg.url,cfg.key);render()}catch(e){cloud.error=e.message;cloud.configured=false;render()}}
async function bootstrapCloud(){if(!cloud.configured||cloud.booting)return;cloud.booting=true;try{cloud.loading=true;const {data:session,error:se}=await cloud.client.auth.getUser();if(se&&!/session missing/i.test(se.message))throw se;cloud.authUser=session?.user||null;if(!cloud.authUser){cloud.homeId=null;cloud.memberProfiles=[];cloud.baseline=null;data=defaultCloudData();render();return}
const {data:members,error}=await cloud.client.from('home_members').select('home_id,profile_id,apptareas_homes(name,invite_code)').eq('user_id',cloud.authUser.id).limit(1);if(error)throw error;if(members?.length){const m=members[0];cloud.homeId=m.home_id;cloud.homeName=m.apptareas_homes?.name||'';cloud.inviteCode=m.apptareas_homes?.invite_code||'';profile=m.profile_id||'u1';await loadCloudMembers();await pullCloudData();subscribeCloud();}else{cloud.homeId=null;cloud.memberProfiles=[];cloud.baseline=null;data=defaultCloudData()}}
catch(e){cloud.error=e.message;console.error(e)}finally{cloud.loading=false;cloud.booting=false;render()}}
async function loadCloudMembers(){if(!cloud.homeId)return;const {data:rows,error}=await cloud.client.from('home_members').select('profile_id').eq('home_id',cloud.homeId);if(error)throw error;cloud.memberProfiles=(rows||[]).map(m=>m.profile_id)}
async function pullCloudData(){if(!cloud.homeId)return;const {data:row,error}=await cloud.client.from('home_state').select('data').eq('home_id',cloud.homeId).single();if(error)throw error;const remote=row.data||defaultCloudData();if(!remote.users||!remote.tasks||!remote.assignments)throw Error('Datos del hogar inválidos');if(!cloud.dirty){data=clone(remote);cloud.baseline=clone(remote);if(!data.users.some(x=>x.id===profile)){cloud.error=tr('Tu perfil aún no está disponible.');}render()}else{cloud.needsRefresh=true}}
function subscribeCloud(){if(cloud.channel){cloud.client.removeChannel(cloud.channel);cloud.channel=null}cloud.channel=cloud.client.channel('home-'+cloud.homeId).on('postgres_changes',{event:'UPDATE',schema:'public',table:'home_state',filter:'home_id=eq.'+cloud.homeId},()=>{clearTimeout(cloud.refreshTimer);cloud.refreshTimer=setTimeout(()=>{if(!cloud.dirty)Promise.all([loadCloudMembers(),pullCloudData()]).then(()=>render()).catch(e=>cloud.error=e.message)},250)}).subscribe()}
function cloudDiff(oldState,newState){let changes={};for(const kind of ['users','tasks','assignments']){const old=new Map((oldState[kind]||[]).map(x=>[x.id,JSON.stringify(x)]));const newer=new Map((newState[kind]||[]).map(x=>[x.id,JSON.stringify(x)]));changes[kind]={upserts:(newState[kind]||[]).filter(x=>old.get(x.id)!==JSON.stringify(x)),deleted:[...old.keys()].filter(id=>!newer.has(id))}}return changes}
function queueCloudSave(){if(!cloud.homeId)return;cloud.dirty=true;cloud.error='';clearTimeout(cloud.flushTimer);cloud.flushTimer=setTimeout(flushCloud,180)}
async function flushCloud(){if(!cloud.homeId||cloud.saving||!cloud.dirty)return;cloud.saving=true;cloud.dirty=false;const send=clone(data),diff=cloudDiff(cloud.baseline||defaultCloudData(),send);try{const {error}=await cloud.client.rpc('patch_home_data',{p_home:cloud.homeId,p_changes:diff});if(error)throw error;cloud.baseline=send;if(cloud.dirty){cloud.saving=false;queueCloudSave();return}await pullCloudData();cloud.error='';}catch(e){console.error(e);cloud.error='No se pudieron sincronizar los cambios: '+e.message;cloud.dirty=true;setTimeout(()=>{if(cloud.homeId&&!cloud.saving)flushCloud()},6000)}finally{cloud.saving=false;render()}}
async function uploadCloudImage(dataUrl,folder){const raw=atob(dataUrl.split(',')[1]),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const name=cloud.homeId+'/'+folder+'/'+uid()+'.webp';const {error}=await cloud.client.storage.from('apptareas-images').upload(name,new Blob([bytes],{type:'image/webp'}),{contentType:'image/webp',upsert:false});if(error)throw error;const {data:res,error:signError}=await cloud.client.storage.from('apptareas-images').createSignedUrl(name,3600);if(signError)throw signError;signedImages.set(name,{url:res.signedUrl,expires:Date.now()+3300000});return 'storage:'+name}
async function cloudAction(a,btn){try{cloud.error='';if(a==='cloud-settings'||a==='cloud-show-setup'){return}if(a==='cloud-config-save'){return}if(a==='cloud-google'){const {error}=await cloud.client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)throw error;return}if(a==='cloud-create'){const {data:id,error}=await cloud.client.rpc('create_apptareas_home',{p_name:val('cloud-home-name')?.trim()||'Nuestro hogar',p_data:defaultCloudData()});if(error)throw error;await bootstrapCloud();return}if(a==='cloud-join'){const code=val('cloud-invite')?.trim();if(!code)throw Error('Introduce un código de invitación');const {error}=await cloud.client.rpc('join_apptareas_home',{p_code:code});if(error)throw error;await bootstrapCloud();return}if(a==='cloud-signout'){if(cloud.channel)await cloud.client.removeChannel(cloud.channel);cloud.channel=null;cloud.homeId=null;cloud.memberProfiles=[];cloud.dirty=false;cloud.baseline=null;await cloud.client.auth.signOut();await bootstrapCloud();return}if(a==='cloud-copy-code'){await navigator.clipboard.writeText(cloud.inviteCode);toast('Código copiado');return}if(a==='cloud-refresh'){await pullCloudData();toast('Sincronizado');return}}catch(e){cloud.error=e.message||String(e);console.error(e);render();alert(cloud.error)}}

let holdTimer=null,holdFired=false;document.addEventListener('pointerdown',e=>{let b=e.target.closest('.task-icon[data-action=quick-toggle]');if(!b)return;holdFired=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holdFired=true;open({kind:'entry',id:b.dataset.id})},620)});['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(holdTimer)));document.addEventListener('contextmenu',e=>{const b=e.target.closest('.task-icon[data-action=quick-toggle]');if(b){e.preventDefault();clearTimeout(holdTimer);holdFired=true;open({kind:'entry',id:b.dataset.id})}});document.addEventListener('click',e=>{if(holdFired){holdFired=false;return}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='backdrop' && e.target!==b)return;action(b.dataset.action,b)});document.addEventListener('change',e=>{if(e.target.dataset.change==='color'){user(profile).color=e.target.value;save();render()}if(e.target.id==='copy-unit'){const m=e.target.value;document.getElementById('copy-origin').value=m==='week'?weekStart(anchor):monthStart(anchor);document.getElementById('copy-target').value=m==='week'?plusDays(weekStart(anchor),7):plusMonths(monthStart(anchor),1)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
startCloud();
})();
