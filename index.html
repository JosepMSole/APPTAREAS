<body>
<div id="app" class="app"></div><div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const KEY='apptareas_v01_store'; const LANG_KEY='apptareas_v02_lang'; let lang=localStorage.getItem(LANG_KEY)||'cast'; if(!['cat','cast','eng'].includes(lang))lang='cast'; const locale=()=>({cat:'ca-ES',cast:'es-ES',eng:'en-GB'}[lang]);const pad=n=>String(n).padStart(2,'0');const localISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const plusDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return localISO(d)};const plusMonths=(s,n)=>{const d=parseISO(s);d.setDate(1);d.setMonth(d.getMonth()+n);return localISO(d)};const weekStart=s=>{const d=parseISO(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return localISO(d)};const monthStart=s=>s.slice(0,7)+'-01';const formatDate=s=>parseISO(s).toLocaleDateString(locale(),{day:'2-digit',month:'2-digit',year:'numeric'});const shortMonth=s=>parseISO(s).toLocaleDateString(locale(),{month:'long',year:'numeric'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);const today=localISO(new Date());const base={users:[{id:'u1',name:'Usuario 1',color:'#7397b8',avatar:''},{id:'u2',name:'Usuario 2',color:'#d99e79',avatar:''}],tasks:[{id:'t1',name:'Cocinar',icon:'🍳',image:''},{id:'t2',name:'Basura',icon:'🗑️',image:''},{id:'t3',name:'Lavadora',icon:'🧺',image:''},{id:'t4',name:'Limpiar',icon:'🧹',image:''},{id:'t5',name:'Compra',icon:'🛒',image:''},{id:'t6',name:'Platos',icon:'🍽️',image:''}],assignments:[{id:'demo1',date:plusDays(weekStart(today),0),taskId:'t2',userId:'u1',completedAt:null},{id:'demo2',date:plusDays(weekStart(today),0),taskId:'t1',userId:'u2',completedAt:null},{id:'demo3',date:plusDays(weekStart(today),1),taskId:'t3',userId:'u2',completedAt:null},{id:'demo4',date:plusDays(weekStart(today),2),taskId:'t5',userId:'u1',completedAt:null},{id:'demo5',date:plusDays(weekStart(today),2),taskId:'t6',userId:'u2',completedAt:null},{id:'demo6',date:plusDays(weekStart(today),3),taskId:'t4',userId:'u2',completedAt:null},{id:'demo7',date:plusDays(weekStart(today),4),taskId:'t1',userId:'u1',completedAt:null},{id:'demo8',date:plusDays(weekStart(today),5),taskId:'t3',userId:'u1',completedAt:null}],templates:{}};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(base)}catch{data=JSON.parse(JSON.stringify(base))}if(!data.users||!data.tasks||!data.assignments)data=JSON.parse(JSON.stringify(base));data.templates||={};let tab='calendar',view='week',anchor=today,selected=today,profile='u1',historyOpen=false,modal=null,toastHandle;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert(tr('No se pudo guardar. El almacenamiento local puede estar lleno. Reduce el tamaño de imágenes.'));return false}};const user=id=>data.users.find(x=>x.id===id),task=id=>data.tasks.find(x=>x.id===id),entries=s=>data.assignments.filter(a=>a.date===s),completed=a=>!!a.completedAt;const PRESET_NAMES={t1:{cat:'Cuinar',cast:'Cocinar',eng:'Cooking'},t2:{cat:'Escombraries',cast:'Basura',eng:'Trash'},t3:{cat:'Rentadora',cast:'Lavadora',eng:'Laundry'},t4:{cat:'Netejar',cast:'Limpiar',eng:'Cleaning'},t5:{cat:'Compra',cast:'Compra',eng:'Groceries'},t6:{cat:'Plats',cast:'Platos',eng:'Dishes'}};const taskName=t=>t?(t.names?.[lang]||((!t.names||!Object.values(t.names).some(Boolean))&&PRESET_NAMES[t.id]&&t.name===PRESET_NAMES[t.id].cast?PRESET_NAMES[t.id][lang]:null)||t.name):tr('Tarea');const imageHTML=(obj,cls='emoji')=>obj?.image?`<img alt="" src="${obj.image}">`:`<span class="${cls}">${esc(obj?.icon||'📋')}</span>`;const avatarHTML=u=>u.avatar?`<img class="avatar" src="${u.avatar}" alt="">`:`<div class="avatar" style="background:${u.color}">👤</div>`;const mix=(hex,opacity)=>{let h=hex.replace('#','');if(h.length!==6)return '#e7e7e1';return '#'+[0,2,4].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*opacity+255*(1-opacity)).toString(16).padStart(2,'0')).join('')};const taskBtn=a=>{let t=task(a.taskId),u=user(a.userId);if(!t||!u)return '';return `<button class="task-icon ${a.completedAt?'done':''}" style="background:${mix(u.color,.22)}" data-action="quick-toggle" data-id="${a.id}" title="${esc(taskName(t))} · ${esc(u.name)}">${imageHTML(t)}</button>`};const dateRows=s=>`<div class="day ${s===today?'today':''}"><div class="day-label"><span class="day-name">${({cat:['DG','DL','DT','DC','DJ','DV','DS'],cast:['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'],eng:['SUN','MON','TUE','WED','THU','FRI','SAT']}[lang])[parseISO(s).getDay()]}</span><span class="day-number">${parseISO(s).getDate()}</span></div><span class="vline"></span><div class="day-tasks">${entries(s).length?entries(s).map(taskBtn).join(''):'<span class="empty">Sin tareas</span>'}</div><button class="add-day" data-action="assign" data-date="${s}" title="Añadir tarea">+</button></div>`;
function calendar(){const start=view==='week'?weekStart(anchor):monthStart(anchor);let body;if(view==='week'){body=`<div class="days">${Array.from({length:7},(_,i)=>dateRows(plusDays(start,i))).join('')}</div>`}else{const first=parseISO(start),firstOffset=(first.getDay()+6)%7,daysIn=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),cells=Math.ceil((firstOffset+daysIn)/7)*7;body=`<div class="month-grid">${({cat:['DL','DT','DC','DJ','DV','DS','DG'],cast:['L','M','X','J','V','S','D'],eng:['M','T','W','T','F','S','S']}[lang]).map(d=>`<div class="weekday">${d}</div>`).join('')}${Array.from({length:cells},(_,i)=>{const s=plusDays(start,i-firstOffset),valid=s.slice(0,7)===start.slice(0,7);return `<button data-action="select-day" data-date="${s}" class="month-day ${!valid?'out':''} ${s===today?'today':''}" style="${s===selected?'outline:2px solid #91a594;':''}"><span>${parseISO(s).getDate()}</span><span class="mini-dots">${entries(s).slice(0,8).map(a=>`<span class="mini-dot" style="background:${user(a.userId)?.color||'#aaa'};opacity:${a.completedAt?.5:1};filter:${a.completedAt?'grayscale(1)':'none'}"></span>`).join('')}</span></button>`}).join('')}</div><div class="month-detail"><div class="month-detail-head"><strong>${formatDate(selected)}</strong><button class="pill" data-action="assign" data-date="${selected}">＋ Tarea</button></div><div class="day-tasks">${entries(selected).length?entries(selected).map(taskBtn).join(''):'<span class="empty">Sin tareas</span>'}</div></div>`}
const title=view==='week'?`${formatDate(start).slice(0,5)} – ${formatDate(plusDays(start,6))}`:shortMonth(start);return `<div class="surface"><div class="section-head"><h1>Calendario</h1><span style="font-size:20px">📅</span></div><div class="segmented"><button data-action="view" data-view="week" class="${view==='week'?'active':''}">Semana</button><button data-action="view" data-view="month" class="${view==='month'?'active':''}">Mes</button></div><div class="period"><button class="arrow" data-action="prev">‹</button><strong>${title}</strong><button class="arrow" data-action="next">›</button></div><div class="legend">${data.users.map(u=>`<span class="legend-item"><i class="dot" style="background:${u.color}"></i>${esc(u.name)}</span>`).join('')}</div>${body}<button class="copy-box" data-action="copy"><b>⧉ &nbsp; COPIAR CONFIGURACIÓN &nbsp; ›</b><span>Semana o mes · Todos o un usuario</span></button><p class="note calendar-tip">${tr("Toca un icono para completar · Mantén pulsado para editar")}</p></div>`}
function tasksPage(){return `<div class="surface"><div class="section-head"><h1>Tareas</h1><button class="pill primary" data-action="task-new">＋ Nueva</button></div><div class="task-grid">${data.tasks.map(t=>`<button class="task-tile" data-action="task-edit" data-id="${t.id}"><span class="big">${imageHTML(t)}</span><span>${esc(taskName(t))}</span></button>`).join('')}</div><p class="subtle">Toca una tarea para editar su nombre o icono.</p></div>`}
function userPage(){const u=user(profile),mine=data.assignments.filter(a=>a.userId===profile),done=mine.filter(completed).sort((a,b)=>b.completedAt.localeCompare(a.completedAt)),pending=mine.filter(a=>!a.completedAt);return `<div class="surface"><div class="section-head"><h1>USER</h1><span style="font-size:20px">👤</span></div><div class="user-switch">${data.users.map(p=>`<button class="user-chip ${profile===p.id?'active':''}" data-action="profile-select" data-id="${p.id}">${avatarHTML(p)}<span>${esc(p.name)}</span></button>`).join('')}</div><div class="user-hero">${avatarHTML(u)}<h2>${esc(u.name)}</h2><div class="subtle">Color personal</div><input aria-label="Color personal" data-change="color" type="color" value="${u.color}" style="height:34px;width:65px;cursor:pointer;border:0;background:transparent"></div><div class="stats"><div class="stat"><strong>${pending.length}</strong><span>Pendientes</span></div><div class="stat"><strong>${done.length}</strong><span>Completadas</span></div></div><button class="fold" data-action="history">🕘 &nbsp; HISTORIAL <span>${historyOpen?'⌃':'⌄'}</span></button>${historyOpen?`<div class="history">${done.length?done.map(a=>`<div class="history-row"><span>${esc(task(a.taskId)?.icon||'✅')}</span><span>${esc(task(a.taskId)?taskName(task(a.taskId)):'Tarea eliminada')}</span><time>Prev. ${formatDate(a.date)}<br>Hecha ${new Date(a.completedAt).toLocaleDateString(locale())}</time><button class="pill" data-action="quick-toggle" data-id="${a.id}" title="Detalles">⋯</button></div>`).join(''):'<p class="subtle">Todavía no hay tareas completadas.</p>'}</div>`:''}<div class="profile-actions"><button class="pill outline" data-action="avatar">▧ Avatar</button><button class="pill outline" data-action="profile-edit">⚙ Nombre</button></div><div class="language-setting"><span class="lang-heading">🌐 &nbsp; IDIOMA / LANGUAGE</span><div class="lang-buttons">${[["cat","CAT"],["cast","CAST"],["eng","ENG"]].map(([code,label])=>`<button type="button" class="la const field=(label,control)=>`<div class="field"><label>${label}</label>${control}</div>`;const inp=(id,value='',type='text',extra='')=>`<input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`;const sel=(id,options,selected)=>`<select id="${id}">${options.map(([value,name])=>`<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(name)}</option>`).join('')}</select>`;const formActions=inner=>`<div class="actions">${inner}</div>`;function drawModal(){const overlay=document.getElementById('overlay');if(!modal){overlay.innerHTML='';return}const m=modal;let title='',content='';if(m.kind==='task'){const t=m.id?task(m.id):null;title=t?'Editar tarea':'Nueva tarea';content=`<div class="form-grid">${field('Nombre',inp('task-name',t?.name||'','text','maxlength="48" placeholder="Ej. Aspiradora"'))}${field('Català',inp('task-cat',t?.names?.cat||'','text','maxlength="48" placeholder="Nom en català (opcional)"'))}${field('English',inp('task-eng',t?.names?.eng||'','text','maxlength="48" placeholder="Task name (optional)"'))}${field('Icono (emoji)',inp('task-icon',t?.icon||'🧹','text','maxlength="8"'))}${field('O sube una imagen personalizada',`<input type="file" id="task-file" accept="image/*"><span class="note">La imagen se guarda localmente. Recomendado: imagen pequeña cuadrada.</span>`)}${t?.image?`<div>Icono actual: <img src="${t.image}" alt="" width="55" height="55" style="object-fit:contain"><label><input type="checkbox" id="task-image-clear"> Quitar imagen</label></div>`:''}</div>${formActions(`<button class="pill primary" data-action="task-save">Guardar</button>${t?'<button class="pill danger" data-action="task-delete">Eliminar</button>':''}<button class="pill outline" data-action="modal-close">Cancelar</button>`)}`}

const open=m=>{modal=m;drawModal()};const close=()=>{modal=null;drawModal()};function toast(t){const el=document.getElementById('toast');el.textContent=tr(t);el.classList.remove('hidden');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.add('hidden'),2700)};const val=id=>document.getElementById(id)?.value;const fileData=async input=>{const file=document.getElementById(input)?.files?.[0];if(!file)return null;if(file.size>7*1024*1024)throw Error('Imagen demasiado grande (máx. 7 MB)');const bitmap=await createImageBitmap(file);let size=256,scale=Math.min(1,size/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close?.();return c.toDataURL('image/webp',.82)};
async function action(a,btn){try{if(a==='language'){lang=btn.dataset.lang;localStorage.setItem(LANG_KEY,lang);render();toast(({cat:'Idioma canviat',cast:'Idioma cambiado',eng:'Language changed'})[lang]);}else if(a==='tab'){tab=btn.dataset.tab;close();render()}else if(a==='view'){view=btn.dataset.view;anchor=view==='week'?weekStart(anchor):monthStart(anchor);selected=anchor;render()}else if(a==='prev'||a==='next'){anchor=view==='week'?plusDays(anchor,a==='prev'?-7:7):plusMonths(anchor,a==='prev'?-1:1);selected=anchor;render()}else if(a==='select-day'){selected=btn.dataset.date;render()}else if(a==='task-new')open({kind:'task'});else if(a==='task-edit')open({kind:'task',id:btn.dataset.id});else if(a==='task-save'){const name=val('task-name')?.trim(),icon=val('task-icon')?.trim()||'📋',names={cat:val('task-cat')?.trim()||'',eng:val('task-eng')?.trim()||''};if(!name)return alert(tr('Introduce el nombre de la tarea'));const existing=modal.id?task(modal.id):null,img=await fileData('task-file');if(existing){existing.name=name;existing.names=names;existing.icon=icon;if(img)existing.image=img;else if(document.getElementById('task-image-clear')?.checked)existing.image=''}else data.tasks.push({id:uid(),name,names,icon,image:img||''});if(save()){close();render();toast('Tarea guardada')}}else if(a==='task-delete'){if(confirm(tr('¿Eliminar esta tarea y todas sus asignaciones (incluidas las completadas)?'))){data.tasks=data.tasks.filter(t=>t.id!==modal.id);data.assignments=data.assignments.filter(x=>x.taskId!==modal.id);save();close();render()}}else if(a==='assign')open({kind:'assign',date:btn.dataset.date,taskId:data.tasks[0]?.id});else if(a==='assign-save'){const date=val('assign-date'),taskId=val('assign-task'),userId=val('assign-user');if(!date||!taskId||!userId)return;data.assignments.push({id:uid(),date,taskId,userId,completedAt:null});if(save()){close();render();toast('Tarea asignada')}}else if(a==='quick-toggle'){const e=data.assignments.find(x=>x.id===btn.dataset.id);if(!e)return;e.completedAt=e.completedAt?null:new Date().toISOString();if(save()){render();toast(e.completedAt?'¡Tarea completada!':'Tarea pendiente')}}else if(a==='entry')open({kind:'entry',id:btn.dataset.id});else if(a==='entry-toggle'){const e=data.assignments.find(x=>x.id===modal.id);e.completedAt=e.completedAt?null:new Date().toISOString();save();close();render();toast(e.completedAt?'¡Tarea completada!':'Tarea pendiente')}else if(a==='entry-update'){const e=data.assignments.find(x=>x.id===modal.id);e.date=val('entry-date');e.userId=val('entry-user');save();close();render();toast('Cambios guardados')}else if(a==='entry-delete'){if(confirm(tr('¿Eliminar esta asignación?'))){data.assignments=data.assignments.filter(x=>x.id!==modal.id);save();close();render()}}else if(a==='copy')open({kind:'copy',unit:view});else if(a==='copy-run'){let unit=val('copy-unit'),who=val('copy-user'),from=val('copy-origin'),to=val('copy-target');if(!from||!to)return;const src=unit==='week'?weekStart(from):monthStart(from),dest=unit==='week'?weekStart(to):monthStart(to);const monthDays=unit==='month'?new Date(parseISO(src).getFullYear(),parseISO(src).getMonth()+1,0).getDate():7;let added=0,skipped=0;const source=data.assignments.filter(x=>x.date>=src&&x.date<(unit==='week'?plusDays(src,7):plusMonths(src,1))&&(who==='all'||who===x.userId));for(const a of source){let date;if(unit==='week'){date=plusDays(dest,Math.round((parseISO(a.date)-parseISO(src))/86400000))}else{let day=parseISO(a.date).getDate(),max=new Date(parseISO(dest).getFullYear(),parseISO(dest).getMonth()+1,0).getDate();if(day>max){skipped++;continue}const d=parseISO(dest);d.setDate(day);date=localISO(d)}if(data.assignments.some(b=>b.date===date&&b.taskId===a.taskId&&b.userId===a.userId)){skipped++;continue}data.assignments.push({id:uid(),date,taskId:a.taskId,userId:a.userId,completedAt:null});added++}save();close();render();toast(`${added} copiadas · ${skipped} omitidas`)}else if(a==='profile-select'){profile=btn.dataset.id;history DICT.cat['Català']='Català';DICT.eng['Català']='Catalan';DICT.cat['English']='Anglès';DICT.eng['English']='English';DICT.cat['Nom en català (opcional)']='Nom en català (opcional)';DICT.eng['Nom en català (opcional)']='Catalan name (optional)';DICT.cat['Task name (optional)']='Nom en anglès (opcional)';DICT.cat['Tarea eliminada']='Tasca eliminada';DICT.eng['Tarea eliminada']='Deleted task';DICT.cat['Toca un icono para completar · Mantén pulsado para editar']='Toca una icona per completar · Mantén premut per editar';DICT.eng['Toca un icono para completar · Mantén pulsado para editar']='Tap an icon to finish · Long-press to edit';function tr(value){let s=String(value??''); if(lang==='cast')return s;const d=DICT[lang]||{};if(Object.prototype.hasOwnProperty.call(d,s))return d[s];let m=s.match(/^(\d+) copiadas · (\d+) omitidas$/);if(m)return lang==='cat'?`${m[1]} copiades · ${m[2]} omeses`:`${m[1]} copied · ${m[2]} skipped`;return s;}
function translateUI(root){if(!root)return;document.documentElement.lang=({cat:'ca',cast:'es',eng:'en'})[lang];if(lang==='cast')return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(['SCRIPT','STYLE'].includes(node.parentElement?.tagName))continue;const original=node.nodeValue,trim=original.trim();if(!trim)continue;let translated=tr(trim);
 if(translated===trim && trim.startsWith('Prev. ')){translated=tr('Prev.')+trim.slice(5)}
 if(translated===trim && trim.startsWith('Hecha ')){translated=tr('Hecha')+trim.slice(5)}
 if(translated===trim && trim.startsWith('Sube una imagen para ')){translated=tr('Sube una imagen para')+trim.slice(19)}
 if(translated!==trim)node.nodeValue=original.replace(trim,translated);
 }
 root.querySelectorAll('[title],[placeholder],[aria-label]').forEach(el=>{for(const attr of ['title','placeholder','aria-label']){if(el.hasAttribute(attr))el.setAttribute(attr,tr(el.getAttribute(attr)))}});
}
let holdTimer=null,holdFired=false;document.addEventListener('pointerdown',e=>{let b=e.target.closest('.task-icon[data-action=quick-toggle]');if(!b)return;holdFired=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holdFired=true;open({kind:'entry',id:b.dataset.id})},620)});['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(holdTimer)));document.addEventListener('contextmenu',e=>{const b=e.target.closest('.task-icon[data-action=quick-toggle]');if(b){e.preventDefault();clearTimeout(holdTimer);holdFired=true;open({kind:'entry',id:b.dataset.id})}});document.addEventListener('click',e=>{if(holdFired){holdFired=false;return}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='backdrop' && e.target!==b)return;action(b.dataset.action,b)});document.addEventListener('change',e=>{if(e.target.dataset.change==='color'){user(profile).color=e.target.value;save();render()}if(e.target.id==='copy-unit'){const m=e.target.value;document.getElementById('copy-origin').value=m==='week'?weekStart(anchor):monthStart(anchor);document.getElementById('copy-target').value=m==='week'?plusDays(weekStart(anchor),7):plusMonths(monthStart(anchor),1)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
})();
